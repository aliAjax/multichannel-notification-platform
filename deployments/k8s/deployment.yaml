apiVersion: apps/v1
kind: Deployment
metadata: {name: notification-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: notification-api}}
  template:
    metadata: {labels: {app: notification-api}}
    spec:
      containers:
        - name: api
          image: notification-platform:local
          ports: [{containerPort: 8080}]
          env:
            - {name: NOTIFY_HTTP_ADDR, value: ":8080"}
            - {name: NOTIFY_DATA_FILE, value: /var/lib/notification/store.json}
            - {name: NOTIFY_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: notification-secrets, key: webhook-secret}}}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/notification}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: notification-api}
spec:
  selector: {app: notification-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: notification-api}
spec: {minAvailable: 1, selector: {matchLabels: {app: notification-api}}}

