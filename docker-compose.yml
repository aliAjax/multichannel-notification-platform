services:
  notification-api:
    build: .
    ports: ["8080:8080"]
    environment:
      NOTIFY_DATA_FILE: /var/lib/notification/store.json
      NOTIFY_HTTP_ADDR: :8080
    volumes: [notification-data:/var/lib/notification]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "/notification-api"]
      interval: 30s
      timeout: 3s
  notification-worker:
    build: .
    entrypoint: ["/notification-worker"]
    environment:
      NOTIFY_DATA_FILE: /var/lib/notification/store.json
    volumes: [notification-data:/var/lib/notification]
volumes:
  notification-data:

