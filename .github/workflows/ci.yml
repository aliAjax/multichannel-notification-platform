name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23'}
      - run: gofmt -l . | tee /tmp/gofmt && test ! -s /tmp/gofmt
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

